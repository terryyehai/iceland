<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img">
  <title>Day 14 雷克雅維克：哈爾格林姆教堂與彩虹街</title>
  <style>
    .cloud { animation: drift 32s linear infinite; }
    .bird { animation: fly 16s linear infinite; }
    .balloonG { animation: floatB 7s ease-in-out infinite; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-820px); } }
    @keyframes fly { from { transform: translateX(-60px); } to { transform: translateX(860px); } }
    @keyframes floatB { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="d14sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#d14sky)"/>
  <circle cx="700" cy="70" r="34" fill="#fef9c3"/>

  <g class="cloud" fill="#ffffff" opacity=".85">
    <g><ellipse cx="150" cy="80" rx="80" ry="16"/><ellipse cx="470" cy="60" rx="100" ry="18"/></g>
    <g transform="translate(820,0)"><ellipse cx="150" cy="80" rx="80" ry="16"/><ellipse cx="470" cy="60" rx="100" ry="18"/></g>
  </g>
  <g class="bird" stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M0 110 q 9 -9 18 0 q 9 -9 18 0"/>
    <path d="M40 132 q 7 -7 14 0 q 7 -7 14 0" opacity=".7"/>
  </g>

  <!-- 哈爾格林姆教堂 -->
  <g>
    <!-- 兩側風琴翼牆（階梯狀玄武岩柱意象） -->
    <g fill="#cbd5e1">
      <path d="M212 300 L 240 300 L 240 232 L 212 244 Z"/>
      <path d="M242 300 L 270 300 L 270 216 L 242 228 Z"/>
      <path d="M272 300 L 300 300 L 300 200 L 272 212 Z"/>
      <path d="M302 300 L 330 300 L 330 182 L 302 194 Z"/>
      <path d="M332 300 L 360 300 L 360 162 L 332 176 Z"/>
      <path d="M588 300 L 560 300 L 560 232 L 588 244 Z"/>
      <path d="M558 300 L 530 300 L 530 216 L 558 228 Z"/>
      <path d="M528 300 L 500 300 L 500 200 L 528 212 Z"/>
      <path d="M498 300 L 470 300 L 470 182 L 498 194 Z"/>
      <path d="M468 300 L 440 300 L 440 162 L 468 176 Z"/>
    </g>
    <g fill="#94a3b8" opacity=".5">
      <path d="M212 244 L 240 232 L 240 236 L 212 248 Z"/>
      <path d="M272 212 L 300 200 L 300 204 L 272 216 Z"/>
      <path d="M332 176 L 360 162 L 360 166 L 332 180 Z"/>
      <path d="M588 244 L 560 232 L 560 236 L 588 248 Z"/>
      <path d="M528 212 L 500 200 L 500 204 L 528 216 Z"/>
      <path d="M468 176 L 440 162 L 440 166 L 468 180 Z"/>
    </g>
    <!-- 中央塔樓 -->
    <path d="M362 300 L 362 130 Q 364 108 380 96 L 380 300 Z" fill="#e2e8f0"/>
    <path d="M438 300 L 438 130 Q 436 108 420 96 L 420 300 Z" fill="#e2e8f0"/>
    <rect x="380" y="88" width="40" height="212" fill="#f1f5f9"/>
    <path d="M380 88 L 400 44 L 420 88 Z" fill="#f1f5f9"/>
    <rect x="397" y="26" width="6" height="22" fill="#64748b"/>
    <!-- 鐘塔窗 -->
    <rect x="388" y="110" width="24" height="40" rx="10" fill="#334155"/>
    <g fill="#475569">
      <rect x="368" y="180" width="8" height="60" rx="4"/>
      <rect x="392" y="180" width="7" height="60" rx="3.5"/>
      <rect x="401" y="180" width="7" height="60" rx="3.5"/>
      <rect x="424" y="180" width="8" height="60" rx="4"/>
    </g>
    <!-- 大門 -->
    <rect x="386" y="256" width="28" height="44" rx="4" fill="#1e293b"/>
  </g>

  <!-- 彩虹街 Skólavörðustígur -->
  <g>
    <rect x="0" y="300" width="800" height="150" fill="#94a3b8"/>
    <g>
      <path d="M310 450 L 330 450 L 372 300 L 366 300 Z" fill="#ef4444"/>
      <path d="M330 450 L 350 450 L 378 300 L 372 300 Z" fill="#f97316"/>
      <path d="M350 450 L 372 450 L 384 300 L 378 300 Z" fill="#facc15"/>
      <path d="M372 450 L 394 450 L 390 300 L 384 300 Z" fill="#22c55e"/>
      <path d="M394 450 L 416 450 L 396 300 L 390 300 Z" fill="#3b82f6"/>
      <path d="M416 450 L 438 450 L 402 300 L 396 300 Z" fill="#6366f1"/>
      <path d="M438 450 L 460 450 L 408 300 L 402 300 Z" fill="#a855f7"/>
    </g>
    <!-- 街邊彩色小屋 -->
    <g>
      <rect x="80" y="252" width="90" height="48" fill="#ef4444"/><path d="M74 254 L 125 224 L 176 254 Z" fill="#991b1b"/><rect x="108" y="270" width="20" height="30" fill="#fef3c7"/>
      <rect x="640" y="250" width="94" height="50" fill="#0ea5e9"/><path d="M634 252 L 687 222 L 740 252 Z" fill="#075985"/><rect x="670" y="268" width="20" height="32" fill="#fef3c7"/>
    </g>
    <!-- 行人 -->
    <g>
      <circle cx="240" cy="360" r="8" fill="#fcd9b8"/><rect x="233" y="368" width="14" height="24" rx="6" fill="#dc2626"/>
      <circle cx="540" cy="372" r="8" fill="#f3c39d"/><rect x="533" y="380" width="14" height="24" rx="6" fill="#7c3aed"/>
      <circle cx="580" cy="366" r="7" fill="#fcd9b8"/><rect x="574" y="373" width="12" height="21" rx="5" fill="#0e7490"/>
    </g>
    <!-- 氣球 -->
    <g class="balloonG">
      <path d="M140 340 l 2 26" stroke="#64748b" stroke-width="2"/>
      <ellipse cx="140" cy="326" rx="13" ry="16" fill="#f43f5e"/>
    </g>
  </g>
</svg>
