<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img">
  <title>Day 15 告別冰島：KEF 機場黃昏起飛</title>
  <style>
    .plane15 { animation: takeoff 10s ease-in-out infinite; }
    .beacon { animation: blink 2.4s ease-in-out infinite; }
    .cloud15 { animation: drift 34s linear infinite; }
    @keyframes takeoff {
      0%, 10% { transform: translate(0,0) rotate(0); }
      55% { transform: translate(330px,-130px) rotate(-9deg); }
      100% { transform: translate(720px,-320px) rotate(-11deg); opacity: 1; }
    }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .2; } }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-820px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="d15sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset=".5" stop-color="#be185d"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#d15sky)"/>
  <circle cx="620" cy="270" r="56" fill="#fde68a"/>
  <circle cx="620" cy="270" r="78" fill="#fde68a" opacity=".3"/>

  <g class="cloud15" fill="#f9a8d4" opacity=".5">
    <g><ellipse cx="200" cy="100" rx="110" ry="13"/><ellipse cx="540" cy="150" rx="130" ry="15"/></g>
    <g transform="translate(820,0)"><ellipse cx="200" cy="100" rx="110" ry="13"/><ellipse cx="540" cy="150" rx="130" ry="15"/></g>
  </g>

  <!-- 遠山剪影 -->
  <polygon points="0,318 130,270 260,312 400,282 560,316 700,292 800,314 800,330 0,330" fill="#2e1065" opacity=".85"/>

  <!-- 地面 -->
  <rect y="330" width="800" height="120" fill="#1e1b4b"/>

  <!-- 航廈（KEF 斜屋頂意象） -->
  <g>
    <path d="M540 330 L 540 286 L 640 264 L 740 286 L 740 330 Z" fill="#312e81"/>
    <g fill="#fbbf24">
      <rect x="556" y="296" width="14" height="18" rx="2"/>
      <rect x="580" y="292" width="14" height="22" rx="2"/>
      <rect x="604" y="288" width="14" height="26" rx="2"/>
      <rect x="628" y="286" width="14" height="28" rx="2"/>
      <rect x="652" y="288" width="14" height="26" rx="2"/>
      <rect x="676" y="292" width="14" height="22" rx="2"/>
      <rect x="700" y="296" width="14" height="18" rx="2"/>
    </g>
    <!-- 塔台 -->
    <rect x="756" y="256" width="12" height="74" fill="#312e81"/>
    <ellipse cx="762" cy="252" rx="18" ry="10" fill="#4338ca"/>
    <circle class="beacon" cx="762" cy="240" r="4" fill="#f87171"/>
  </g>

  <!-- 跑道 -->
  <path d="M0 400 L 800 400 L 800 428 L 0 428 Z" fill="#0f172a"/>
  <g fill="#fde68a">
    <rect x="20" y="411" width="46" height="6" rx="3"/>
    <rect x="110" y="411" width="46" height="6" rx="3"/>
    <rect x="200" y="411" width="46" height="6" rx="3"/>
    <rect x="290" y="411" width="46" height="6" rx="3"/>
    <rect x="380" y="411" width="46" height="6" rx="3"/>
    <rect x="470" y="411" width="46" height="6" rx="3"/>
    <rect x="560" y="411" width="46" height="6" rx="3"/>
    <rect x="650" y="411" width="46" height="6" rx="3"/>
    <rect x="740" y="411" width="46" height="6" rx="3"/>
  </g>
  <g class="beacon" fill="#38bdf8" style="animation-delay:1.2s">
    <circle cx="60" cy="404" r="3"/><circle cx="240" cy="404" r="3"/><circle cx="420" cy="404" r="3"/><circle cx="600" cy="404" r="3"/>
  </g>

  <!-- 起飛的飛機 -->
  <g class="plane15">
    <g transform="translate(120,382)">
      <path d="M -70 0 Q -63 -11 -38 -12 L 60 -12 Q 86 -9 96 0 Q 86 8 60 9 L -38 9 Q -63 9 -70 0 Z" fill="#f8fafc"/>
      <path d="M -69 -1 L -50 -36 L -32 -36 L -48 -1 Z" fill="#7c3aed"/>
      <path d="M 6 1 L -46 38 L -20 40 L 28 5 Z" fill="#e2e8f0"/>
      <ellipse cx="-12" cy="20" rx="11" ry="6" fill="#475569"/>
      <path d="M 74 -7 Q 88 -5 93 -1 L 74 -1 Z" fill="#312e81"/>
      <g fill="#93c5fd"><circle cx="44" cy="-4" r="2.4"/><circle cx="30" cy="-4" r="2.4"/><circle cx="16" cy="-4" r="2.4"/><circle cx="2" cy="-4" r="2.4"/></g>
    </g>
  </g>

  <!-- 揮手道別的旅人 -->
  <g>
    <circle cx="90" cy="368" r="9" fill="#fcd9b8"/>
    <rect x="82" y="377" width="16" height="24" rx="7" fill="#0e7490"/>
    <path d="M98 382 q 12 -10 14 -20" stroke="#fcd9b8" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- 行李箱 -->
    <rect x="106" y="384" width="16" height="20" rx="3" fill="#dc2626"/>
    <path d="M110 384 l 0 -6 l 8 0 l 0 6" stroke="#7f1d1d" stroke-width="3" fill="none"/>
  </g>
</svg>
