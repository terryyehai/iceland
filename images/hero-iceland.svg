<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" preserveAspectRatio="xMidYMid slice">
  <title>冰島自駕環島：夏日冰河湖、火山、黑沙灘與海鸚</title>
  <style>
    .cloud { animation: driftCloud 26s linear infinite; }
    .cloud.c2 { animation-duration: 34s; animation-delay: -14s; }
    .aurora { animation: sway 10s ease-in-out infinite; transform-origin: 400px 90px; }
    .aurora.a2 { animation-delay: 2.4s; animation-duration: 13s; }
    .lava-glow { animation: glow 4s ease-in-out infinite; }
    .lava-flow { animation: glow 4s ease-in-out infinite reverse; }
    .ember { animation: rise 5s linear infinite; }
    .ember.e2 { animation-delay: 1.7s; }
    .ember.e3 { animation-delay: 3.4s; }
    .berg { animation: bob 6s ease-in-out infinite; }
    .berg.b2 { animation-delay: 1.8s; animation-duration: 7s; }
    .berg.b3 { animation-delay: 3.5s; animation-duration: 8s; }
    .ripple { animation: ripple 5s ease-in-out infinite; transform-origin: center; }
    .wave { animation: drift 7s ease-in-out infinite; }
    .wave.w2 { animation-delay: 2.4s; animation-duration: 9s; }
    .puffin { animation: bob 5s ease-in-out infinite; }
    @keyframes driftCloud { 0% { transform: translateX(-120px); } 100% { transform: translateX(920px); } }
    @keyframes sway { 0%,100% { transform: translateX(0) scaleY(1); opacity:.5; } 50% { transform: translateX(16px) scaleY(1.06); opacity:.8; } }
    @keyframes glow { 0%,100% { opacity:.55; } 50% { opacity:1; } }
    @keyframes rise { 0% { transform: translateY(0); opacity:0; } 15% { opacity:.9; } 100% { transform: translateY(-60px); opacity:0; } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes ripple { 0%,100% { transform: scaleX(1); opacity:.7; } 50% { transform: scaleX(1.06); opacity:1; } }
    @keyframes drift { 0%,100% { transform: translateX(0); opacity:.6; } 50% { transform: translateX(-18px); opacity:.9; } }
    @media (prefers-reduced-motion: reduce) { .cloud,.aurora,.lava-glow,.lava-flow,.ember,.berg,.ripple,.wave,.puffin { animation: none !important; } }
  </style>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="auroraGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ee7b7" stop-opacity="0"/>
      <stop offset=".5" stop-color="#6ee7b7" stop-opacity=".35"/>
      <stop offset="1" stop-color="#a7f3d0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="auroraTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset=".55" stop-color="#5eead4" stop-opacity=".28"/>
      <stop offset="1" stop-color="#99f6e4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="volcano" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748b"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="lava" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset=".4" stop-color="#f97316"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <radialGradient id="craterGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fb923c" stop-opacity=".6"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bae6fd"/>
      <stop offset=".5" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="blackSand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- 夏日天空 -->
  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- 太陽 -->
  <circle cx="120" cy="76" r="30" fill="#fef3c7"/>
  <circle cx="120" cy="76" r="44" fill="#fde68a" opacity=".35"/>

  <!-- 淡彩極光（白夜氛圍） -->
  <path class="aurora" fill="url(#auroraGreen)"
    d="M-20,30 C110,80 220,20 350,60 C470,95 590,35 820,70 L820,150 C650,115 540,165 420,130 C300,98 180,155 -20,110 Z"/>
  <path class="aurora a2" fill="url(#auroraTeal)"
    d="M-20,70 C140,120 280,60 420,100 C550,138 670,80 820,120 L820,180 C670,145 560,195 430,160 C310,128 160,180 -20,145 Z"/>

  <!-- 飄動的雲 -->
  <g class="cloud" fill="#ffffff" opacity=".9">
    <ellipse cx="0" cy="60" rx="46" ry="15"/>
    <ellipse cx="34" cy="52" rx="30" ry="12"/>
  </g>
  <g class="cloud c2" fill="#ffffff" opacity=".75">
    <ellipse cx="0" cy="120" rx="38" ry="12"/>
    <ellipse cx="28" cy="113" rx="24" ry="10"/>
  </g>

  <!-- 遠方火山（熔岩） -->
  <g>
    <ellipse cx="640" cy="238" rx="90" ry="34" fill="url(#craterGlow)" class="lava-glow"/>
    <path d="M520,300 L610,208 L632,230 L654,204 L760,300 Z" fill="url(#volcano)"/>
    <path class="lava-flow" fill="url(#lava)"
      d="M626,214 L640,208 L652,216 L648,232 L656,252 L648,276 L654,300 L636,300 L640,272 L630,250 L636,232 Z"/>
    <path d="M610,208 L632,230 L654,204 L646,220 L633,238 L616,218 Z" fill="#ffffff" opacity=".95"/>
    <circle class="ember"    cx="636" cy="206" r="2.2" fill="#f97316"/>
    <circle class="ember e2" cx="646" cy="210" r="1.6" fill="#ea580c"/>
    <circle class="ember e3" cx="628" cy="212" r="1.8" fill="#fb923c"/>
  </g>

  <!-- 遠山（雪頂） -->
  <path d="M-10,300 L90,216 L170,276 L250,208 L340,300 Z" fill="#94a3b8"/>
  <path d="M90,216 L112,234 L104,242 L76,228 Z M250,208 L274,230 L262,242 L232,224 Z" fill="#ffffff" opacity=".95"/>

  <!-- 冰河湖 -->
  <rect y="298" width="800" height="82" fill="url(#sea)"/>
  <ellipse class="ripple" cx="400" cy="316" rx="330" ry="8" fill="#e0f7fa" opacity=".8"/>
  <ellipse class="ripple" cx="360" cy="348" rx="280" ry="7" fill="#f0fdff" opacity=".7" style="animation-delay:1.6s"/>
  <!-- 熔岩倒影 -->
  <path d="M626,302 L654,302 L648,336 L634,336 Z" fill="#f97316" opacity=".18" class="lava-glow"/>

  <!-- 浮冰 -->
  <g class="berg">
    <path d="M120,318 L150,282 L176,296 L196,286 L218,320 L200,332 L136,332 Z" fill="url(#ice)"/>
    <path d="M150,282 L176,296 L168,318 L146,312 Z" fill="#fff" opacity=".9"/>
    <path d="M136,332 L200,332 L196,340 L142,340 Z" fill="#67e8f9" opacity=".5"/>
  </g>
  <g class="berg b2">
    <path d="M330,330 L352,304 L372,314 L388,332 L372,342 L340,342 Z" fill="url(#ice)"/>
    <path d="M352,304 L372,314 L364,330 Z" fill="#fff" opacity=".85"/>
  </g>
  <g class="berg b3">
    <path d="M480,336 L494,320 L510,326 L520,338 L508,346 L488,346 Z" fill="url(#ice)"/>
  </g>

  <!-- 黑沙灘前景 -->
  <path d="M-10,380 C120,362 260,392 400,376 C540,360 680,390 810,370 L810,455 L-10,455 Z" fill="url(#blackSand)"/>
  <!-- 浪花 -->
  <path class="wave" d="M-10,382 C120,364 260,394 400,378 C540,362 680,392 810,372" fill="none" stroke="#ffffff" stroke-width="2.5" opacity=".85"/>
  <path class="wave w2" d="M-10,390 C130,374 270,400 410,386 C550,372 690,398 810,382" fill="none" stroke="#bae6fd" stroke-width="1.5" opacity=".5"/>
  <!-- 黑沙質感 -->
  <g fill="#475569" opacity=".6">
    <circle cx="90" cy="408" r="2"/><circle cx="150" cy="428" r="1.5"/><circle cx="240" cy="414" r="2.2"/>
    <circle cx="330" cy="432" r="1.6"/><circle cx="430" cy="410" r="2"/><circle cx="520" cy="430" r="1.5"/>
    <circle cx="610" cy="416" r="2.1"/><circle cx="700" cy="434" r="1.6"/><circle cx="760" cy="412" r="1.9"/>
  </g>

  <!-- 玄武岩海蝕柱 -->
  <g fill="#334155">
    <path d="M40,380 L44,308 L58,304 L64,380 Z"/>
    <path d="M68,380 L70,330 L82,326 L88,380 Z"/>
  </g>

  <!-- 品牌識別：海鸚 -->
  <g class="puffin">
    <g transform="translate(688,352)">
      <!-- 站立的岩石 -->
      <path d="M-34,46 L-26,20 L6,12 L40,22 L46,48 Z" fill="#334155"/>
      <!-- 身體 -->
      <path d="M-6,10 C-20,10 -26,-4 -22,-18 C-19,-29 -8,-36 2,-36 C10,-36 16,-32 20,-25 C23,-19 23,-12 21,-4 C19,4 13,10 4,10 Z" fill="#1e293b"/>
      <!-- 白胸 -->
      <path d="M-2,8 C-10,6 -14,-4 -11,-14 C-9,-21 -3,-26 3,-25 C9,-24 13,-18 13,-10 C13,-1 8,7 -2,8 Z" fill="#ffffff"/>
      <!-- 頭與臉頰 -->
      <circle cx="10" cy="-27" r="10.5" fill="#1e293b"/>
      <circle cx="13" cy="-26" r="6.5" fill="#ffffff"/>
      <!-- 招牌大喙 -->
      <path d="M18,-30 C25,-33 32,-31 34,-26 C35,-22 31,-18 25,-18 C21,-18 18,-21 17,-25 Z" fill="#f97316"/>
      <path d="M18,-30 C24,-32 30,-31 33,-27 L18,-26 Z" fill="#fbbf24"/>
      <!-- 眼睛 -->
      <circle cx="11" cy="-28" r="1.6" fill="#0f172a"/>
      <!-- 腳 -->
      <path d="M-4,10 L-6,18 L-12,18 M6,10 L6,18 L0,18" stroke="#f97316" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- 翅膀 -->
      <path d="M-8,-22 C-16,-18 -18,-8 -14,0 C-10,-2 -6,-10 -6,-18 Z" fill="#0f172a"/>
    </g>
  </g>
</svg>
