<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img">
  <title>冰島自駕環島：極光、火山與冰河湖</title>
  <style>
    .aurora { animation: sway 9s ease-in-out infinite; transform-origin: center; }
    .aurora.a2 { animation-delay: 1.5s; }
    .aurora.a3 { animation-delay: 3s; }
    .star { animation: twinkle 3.4s ease-in-out infinite; }
    .star.s2 { animation-delay: 1.1s; }
    .star.s3 { animation-delay: 2.2s; }
    .berg { animation: bob 6s ease-in-out infinite; transform-origin: center; }
    .berg.b2 { animation-delay: 1.8s; }
    .ripple { animation: ripple 5s ease-in-out infinite; transform-origin: center; }
    @keyframes sway { 0%,100% { transform: translateX(0) scaleY(1); opacity:.75; } 50% { transform: translateX(14px) scaleY(1.05); opacity:.95; } }
    @keyframes twinkle { 0%,100% { opacity:.25; } 50% { opacity:1; } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes ripple { 0%,100% { transform: scaleX(1); opacity:.6; } 50% { transform: scaleX(1.05); opacity:.9; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <defs>
    <linearGradient id="heroSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1330"/>
      <stop offset=".45" stop-color="#12213f"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="heroAurora1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity=".05"/>
      <stop offset=".5" stop-color="#34d399" stop-opacity=".55"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="heroAurora2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".05"/>
      <stop offset=".5" stop-color="#a78bfa" stop-opacity=".45"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="heroMountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="heroVolcano" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="heroLagoon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".55" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <radialGradient id="lavaGlow" cx="50%" cy="100%" r="70%">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 夜空 -->
  <rect width="800" height="450" fill="url(#heroSky)"/>

  <!-- 星星 -->
  <circle class="star" cx="70" cy="46" r="1.6" fill="#fff"/>
  <circle class="star s2" cx="150" cy="80" r="1.2" fill="#fff"/>
  <circle class="star s3" cx="240" cy="40" r="1.4" fill="#fff"/>
  <circle class="star s2" cx="520" cy="55" r="1.5" fill="#fff"/>
  <circle class="star" cx="620" cy="90" r="1.3" fill="#fff"/>
  <circle class="star s3" cx="700" cy="50" r="1.6" fill="#fff"/>
  <circle class="star" cx="760" cy="110" r="1.2" fill="#fff"/>

  <!-- 極光 -->
  <path class="aurora a1" d="M60 40 Q 220 10 380 90 Q 520 160 700 70 L 700 230 Q 500 300 340 210 Q 200 140 60 200 Z" fill="url(#heroAurora1)"/>
  <path class="aurora a2" d="M0 70 Q 180 130 360 60 Q 540 -10 780 100 L 780 250 Q 560 340 360 220 Q 180 130 0 210 Z" fill="url(#heroAurora2)"/>
  <path class="aurora a3" d="M120 20 Q 300 90 480 30 Q 600 -10 760 50 L 760 150 Q 560 220 420 140 Q 280 70 120 120 Z" fill="url(#heroAurora1)" opacity=".6"/>

  <!-- 遠山剪影 -->
  <polygon points="0,270 120,190 260,255 400,175 560,260 700,200 800,250 800,300 0,300" fill="url(#heroMountain)" opacity=".85"/>

  <!-- 火山（主體） -->
  <polygon points="470,300 560,150 650,300" fill="url(#heroVolcano)"/>
  <polygon points="530,220 560,168 592,222" fill="#e2e8f0" opacity=".9"/>
  <ellipse cx="560" cy="185" rx="30" ry="14" fill="url(#lavaGlow)"/>
  <path d="M550 190 Q 560 210 552 240 Q 566 260 558 300" stroke="#fb923c" stroke-width="4" fill="none" opacity=".85"/>

  <!-- 冰河與冰山 -->
  <path d="M0 300 Q 140 275 260 298 Q 150 320 0 310 Z" fill="#e0f2fe" opacity=".9"/>
  <g class="berg">
    <polygon points="90,300 130,255 170,300" fill="#bae6fd"/>
    <polygon points="105,300 130,268 155,300" fill="#e0f2fe"/>
  </g>
  <g class="berg b2">
    <polygon points="190,300 220,268 252,300" fill="#93c5fd"/>
  </g>

  <!-- 湖水 -->
  <rect y="300" width="800" height="150" fill="url(#heroLagoon)"/>
  <ellipse class="ripple" cx="400" cy="332" rx="360" ry="12" fill="#e0f7fa" opacity=".55"/>
  <ellipse class="ripple" cx="420" cy="372" rx="300" ry="10" fill="#f0fdff" opacity=".45" style="animation-delay:1.4s"/>
  <ellipse class="ripple" cx="380" cy="410" rx="260" ry="9" fill="#e0f7fa" opacity=".4" style="animation-delay:2.6s"/>

  <!-- 海鸚 Puffin 剪影（品牌識別） -->
  <g transform="translate(660,320)">
    <ellipse cx="0" cy="30" rx="30" ry="8" fill="#000" opacity=".12"/>
    <path d="M0 0 C -16 2 -24 18 -18 34 C -14 44 12 46 20 34 C 28 20 20 2 0 0 Z" fill="#1e293b"/>
    <path d="M-16 20 C -16 30 -4 38 4 34 C 12 30 12 18 4 12 C -4 8 -16 10 -16 20 Z" fill="#f8fafc"/>
    <path d="M14 10 L 30 6 L 30 14 L 16 18 Z" fill="#f97316"/>
    <path d="M14 16 L 28 18 L 24 24 L 14 22 Z" fill="#facc15"/>
    <circle cx="6" cy="8" r="2.2" fill="#0f172a"/>
    <path d="M-6 40 L -2 48 L 2 40 Z" fill="#f97316"/>
    <path d="M4 40 L 8 48 L 12 40 Z" fill="#f97316"/>
  </g>

  <!-- 前景黑沙灘 -->
  <path d="M0 400 Q 200 380 400 402 Q 600 424 800 396 L 800 450 L 0 450 Z" fill="#0f172a"/>
</svg>
