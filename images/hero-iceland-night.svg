<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" preserveAspectRatio="xMidYMid slice">
  <title>冰島自駕環島：極光夜空、火山熔岩、冰河浮冰、黑沙灘與海鸚</title>
  <style>
    .aurora { animation: sway 9s ease-in-out infinite; transform-origin: 400px 120px; }
    .aurora.a2 { animation-delay: 1.6s; animation-duration: 11s; }
    .aurora.a3 { animation-delay: 3.2s; animation-duration: 13s; }
    .star { animation: twinkle 3.4s ease-in-out infinite; }
    .star.s2 { animation-delay: 1.1s; }
    .star.s3 { animation-delay: 2.2s; }
    .star.s4 { animation-delay: .6s; animation-duration: 4.2s; }
    .lava-glow { animation: glow 4s ease-in-out infinite; }
    .lava-flow { animation: glow 4s ease-in-out infinite reverse; }
    .ember { animation: rise 5s linear infinite; }
    .ember.e2 { animation-delay: 1.7s; }
    .ember.e3 { animation-delay: 3.4s; }
    .berg { animation: bob 6s ease-in-out infinite; }
    .berg.b2 { animation-delay: 1.8s; animation-duration: 7s; }
    .berg.b3 { animation-delay: 3.5s; animation-duration: 8s; }
    .wave { animation: drift 7s ease-in-out infinite; }
    .wave.w2 { animation-delay: 2.4s; animation-duration: 9s; }
    .puffin { animation: bob 5s ease-in-out infinite; }
    @keyframes sway { 0%,100% { transform: translateX(0) scaleY(1); opacity:.7; } 50% { transform: translateX(16px) scaleY(1.08); opacity:1; } }
    @keyframes twinkle { 0%,100% { opacity:.2; } 50% { opacity:1; } }
    @keyframes glow { 0%,100% { opacity:.55; } 50% { opacity:1; } }
    @keyframes rise { 0% { transform: translateY(0); opacity:0; } 15% { opacity:.9; } 100% { transform: translateY(-60px); opacity:0; } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes drift { 0%,100% { transform: translateX(0); opacity:.5; } 50% { transform: translateX(-18px); opacity:.85; } }
    @media (prefers-reduced-motion: reduce) { .aurora,.star,.lava-glow,.lava-flow,.ember,.berg,.wave,.puffin { animation: none !important; } }
  </style>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070d24"/>
      <stop offset=".5" stop-color="#0f1d3d"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="auroraGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset=".5" stop-color="#34d399" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6ee7b7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="auroraTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset=".55" stop-color="#2dd4bf" stop-opacity=".45"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="auroraPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset=".5" stop-color="#a78bfa" stop-opacity=".38"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="volcano" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3350"/>
      <stop offset="1" stop-color="#151c33"/>
    </linearGradient>
    <linearGradient id="lava" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset=".4" stop-color="#f97316"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <radialGradient id="craterGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fb923c" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16304f"/>
      <stop offset="1" stop-color="#0c1b33"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="blackSand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2137"/>
      <stop offset="1" stop-color="#0a0e1d"/>
    </linearGradient>
  </defs>

  <!-- 夜空 -->
  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- 星星 -->
  <g fill="#e0f2fe">
    <circle class="star"    cx="70"  cy="52"  r="1.6"/>
    <circle class="star s2" cx="150" cy="28"  r="1.2"/>
    <circle class="star s3" cx="238" cy="70"  r="1.8"/>
    <circle class="star s4" cx="330" cy="34"  r="1.3"/>
    <circle class="star s2" cx="422" cy="62"  r="1.5"/>
    <circle class="star"    cx="512" cy="26"  r="1.2"/>
    <circle class="star s3" cx="596" cy="58"  r="1.7"/>
    <circle class="star s4" cx="676" cy="30"  r="1.3"/>
    <circle class="star s2" cx="742" cy="76"  r="1.5"/>
    <circle class="star s3" cx="380" cy="110" r="1.1"/>
    <circle class="star"    cx="640" cy="118" r="1.2"/>
    <circle class="star s4" cx="110" cy="128" r="1.3"/>
  </g>

  <!-- 極光簾幕 -->
  <path class="aurora" fill="url(#auroraGreen)"
    d="M-20,30 C90,90 150,10 260,70 C340,115 420,40 520,80 C610,115 700,55 820,90 L820,190 C700,150 600,205 500,165 C400,128 320,195 220,150 C130,110 60,165 -20,130 Z"/>
  <path class="aurora a2" fill="url(#auroraTeal)"
    d="M-20,90 C110,150 220,80 340,130 C450,175 560,100 680,150 C740,175 780,150 820,160 L820,235 C720,205 620,255 500,215 C390,178 290,240 170,195 C90,165 40,205 -20,185 Z"/>
  <path class="aurora a3" fill="url(#auroraPurple)"
    d="M-20,55 C130,115 260,45 390,100 C510,150 630,75 820,125 L820,175 C650,130 540,190 420,150 C300,112 180,175 -20,120 Z"/>

  <!-- 遠方火山（熔岩） -->
  <g>
    <ellipse cx="640" cy="238" rx="90" ry="34" fill="url(#craterGlow)" class="lava-glow"/>
    <path d="M520,300 L610,208 L632,230 L654,204 L760,300 Z" fill="url(#volcano)"/>
    <path class="lava-flow" fill="url(#lava)"
      d="M626,214 L640,208 L652,216 L648,232 L656,252 L648,276 L654,300 L636,300 L640,272 L630,250 L636,232 Z"/>
    <path d="M610,208 L632,230 L654,204 L646,220 L633,238 L616,218 Z" fill="#e2e8f0" opacity=".85"/>
    <circle class="ember"    cx="636" cy="206" r="2.2" fill="#fbbf24"/>
    <circle class="ember e2" cx="646" cy="210" r="1.6" fill="#f97316"/>
    <circle class="ember e3" cx="628" cy="212" r="1.8" fill="#fb923c"/>
  </g>

  <!-- 遠山 -->
  <path d="M-10,300 L90,222 L170,278 L250,214 L340,300 Z" fill="#1c2a4a"/>
  <path d="M90,222 L110,238 L128,224 L104,240 Z M250,214 L272,234 L288,222 L262,238 Z" fill="#dbeafe" opacity=".7"/>

  <!-- 冰河湖海面 -->
  <rect y="298" width="800" height="82" fill="url(#sea)"/>
  <g stroke="#7dd3fc" stroke-width="1.4" stroke-linecap="round" opacity=".5">
    <path class="wave"    d="M60,322 h90 M420,336 h70 M660,318 h80"/>
    <path class="wave w2" d="M200,348 h110 M540,352 h90 M40,360 h70"/>
  </g>
  <!-- 熔岩與極光倒影 -->
  <path d="M626,302 L654,302 L648,340 L634,340 Z" fill="#f97316" opacity=".22" class="lava-glow"/>
  <path d="M120,302 h180 v6 h-180 Z M360,310 h140 v5 h-140 Z" fill="#34d399" opacity=".1"/>

  <!-- 浮冰 -->
  <g class="berg">
    <path d="M120,318 L150,282 L176,296 L196,286 L218,320 L200,332 L136,332 Z" fill="url(#ice)"/>
    <path d="M150,282 L176,296 L168,318 L146,312 Z" fill="#fff" opacity=".8"/>
  </g>
  <g class="berg b2">
    <path d="M330,330 L352,304 L372,314 L388,332 L372,342 L340,342 Z" fill="url(#ice)" opacity=".95"/>
    <path d="M352,304 L372,314 L364,330 Z" fill="#fff" opacity=".75"/>
  </g>
  <g class="berg b3">
    <path d="M480,336 L494,320 L510,326 L520,338 L508,346 L488,346 Z" fill="url(#ice)" opacity=".9"/>
  </g>

  <!-- 黑沙灘前景 -->
  <path d="M-10,380 C120,362 260,392 400,376 C540,360 680,390 810,370 L810,455 L-10,455 Z" fill="url(#blackSand)"/>
  <!-- 浪花線 -->
  <path class="wave" d="M-10,382 C120,364 260,394 400,378 C540,362 680,392 810,372" fill="none" stroke="#bae6fd" stroke-width="2" opacity=".55"/>
  <!-- 黑沙質感 -->
  <g fill="#3b4568" opacity=".55">
    <circle cx="90" cy="408" r="2"/><circle cx="150" cy="428" r="1.5"/><circle cx="240" cy="414" r="2.2"/>
    <circle cx="330" cy="432" r="1.6"/><circle cx="430" cy="410" r="2"/><circle cx="520" cy="430" r="1.5"/>
    <circle cx="610" cy="416" r="2.1"/><circle cx="700" cy="434" r="1.6"/><circle cx="760" cy="412" r="1.9"/>
  </g>

  <!-- 玄武岩海蝕柱 -->
  <g fill="#131a30">
    <path d="M40,380 L44,308 L58,304 L64,380 Z"/>
    <path d="M68,380 L70,330 L82,326 L88,380 Z"/>
  </g>

  <!-- 品牌識別：海鸚剪影 -->
  <g class="puffin">
    <g transform="translate(688,352)">
      <!-- 站立的岩石 -->
      <path d="M-34,46 L-26,20 L6,12 L40,22 L46,48 Z" fill="#10162b"/>
      <!-- 身體 -->
      <path d="M-6,10 C-20,10 -26,-4 -22,-18 C-19,-29 -8,-36 2,-36 C10,-36 16,-32 20,-25 C23,-19 23,-12 21,-4 C19,4 13,10 4,10 Z" fill="#0c1122"/>
      <!-- 白胸 -->
      <path d="M-2,8 C-10,6 -14,-4 -11,-14 C-9,-21 -3,-26 3,-25 C9,-24 13,-18 13,-10 C13,-1 8,7 -2,8 Z" fill="#e8edf6"/>
      <!-- 頭與臉頰 -->
      <circle cx="10" cy="-27" r="10.5" fill="#0c1122"/>
      <circle cx="13" cy="-26" r="6.5" fill="#e8edf6"/>
      <!-- 招牌大喙 -->
      <path d="M18,-30 C25,-33 32,-31 34,-26 C35,-22 31,-18 25,-18 C21,-18 18,-21 17,-25 Z" fill="#f97316"/>
      <path d="M18,-30 C24,-32 30,-31 33,-27 L18,-26 Z" fill="#fbbf24"/>
      <!-- 眼睛 -->
      <circle cx="11" cy="-28" r="1.6" fill="#0c1122"/>
      <!-- 腳 -->
      <path d="M-4,10 L-6,18 L-12,18 M6,10 L6,18 L0,18" stroke="#f97316" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- 翅膀 -->
      <path d="M-8,-22 C-16,-18 -18,-8 -14,0 C-10,-2 -6,-10 -6,-18 Z" fill="#050a18"/>
    </g>
  </g>
</svg>
