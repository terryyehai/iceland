<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img">
  <title>Day 1 啟程：機窗外的雲海與夕陽</title>
  <style>
    .cloud-a { animation: drift 26s linear infinite; }
    .cloud-b { animation: drift 38s linear infinite reverse; }
    .plane { animation: bob 5s ease-in-out infinite; }
    .sunGlow { animation: glow 6s ease-in-out infinite; transform-origin: 620px 300px; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-820px); } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes glow { 0%,100% { transform: scale(1); opacity:.55; } 50% { transform: scale(1.12); opacity:.8; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="d1sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset=".45" stop-color="#3b82f6"/>
      <stop offset=".75" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="d1sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#d1sky)"/>

  <!-- 夕陽 -->
  <circle class="sunGlow" cx="620" cy="300" r="90" fill="#fef3c7" opacity=".5"/>
  <circle cx="620" cy="300" r="52" fill="#fef9c3"/>

  <!-- 雲海（下層） -->
  <rect y="330" width="800" height="120" fill="url(#d1sea)"/>
  <g class="cloud-b" fill="#fed7aa" opacity=".9">
    <g>
      <ellipse cx="120" cy="340" rx="130" ry="26"/>
      <ellipse cx="360" cy="352" rx="170" ry="30"/>
      <ellipse cx="640" cy="338" rx="150" ry="26"/>
    </g>
    <g transform="translate(820,0)">
      <ellipse cx="120" cy="340" rx="130" ry="26"/>
      <ellipse cx="360" cy="352" rx="170" ry="30"/>
      <ellipse cx="640" cy="338" rx="150" ry="26"/>
    </g>
  </g>
  <g fill="#ffedd5">
    <ellipse cx="200" cy="392" rx="220" ry="42"/>
    <ellipse cx="560" cy="405" rx="260" ry="48"/>
    <ellipse cx="780" cy="392" rx="180" ry="38"/>
  </g>

  <!-- 高空捲雲 -->
  <g class="cloud-a" fill="#dbeafe" opacity=".55">
    <g>
      <ellipse cx="150" cy="90" rx="90" ry="12"/>
      <ellipse cx="430" cy="60" rx="120" ry="14"/>
      <ellipse cx="700" cy="110" rx="80" ry="10"/>
    </g>
    <g transform="translate(820,0)">
      <ellipse cx="150" cy="90" rx="90" ry="12"/>
      <ellipse cx="430" cy="60" rx="120" ry="14"/>
      <ellipse cx="700" cy="110" rx="80" ry="10"/>
    </g>
  </g>

  <!-- 飛機 -->
  <g class="plane">
    <g transform="translate(240,190) rotate(-6)">
      <!-- 機身 -->
      <path d="M -110 0 Q -100 -16 -60 -18 L 95 -18 Q 135 -14 150 0 Q 135 12 95 14 L -60 14 Q -100 14 -110 0 Z" fill="#f8fafc"/>
      <path d="M -110 0 Q -100 10 -60 14 L 95 14 Q 135 12 150 0 L -110 0 Z" fill="#cbd5e1"/>
      <!-- 尾翼 -->
      <path d="M -108 -2 L -80 -54 L -52 -54 L -76 -2 Z" fill="#2563eb"/>
      <!-- 主翼 -->
      <path d="M 10 2 L -78 66 L -34 68 L 46 8 Z" fill="#e2e8f0"/>
      <!-- 引擎 -->
      <ellipse cx="-20" cy="34" rx="17" ry="9" fill="#475569"/>
      <!-- 窗 -->
      <path d="M 118 -10 Q 138 -8 146 -1 L 118 -1 Z" fill="#1e3a8a"/>
      <g fill="#93c5fd">
        <circle cx="70" cy="-6" r="3.4"/><circle cx="50" cy="-6" r="3.4"/><circle cx="30" cy="-6" r="3.4"/>
        <circle cx="10" cy="-6" r="3.4"/><circle cx="-10" cy="-6" r="3.4"/><circle cx="-30" cy="-6" r="3.4"/>
      </g>
    </g>
  </g>
</svg>
