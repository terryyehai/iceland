<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img">
  <title>Day 6 黑沙灘騎馬與冰河湖浮冰</title>
  <style>
    .surf { animation: surf 6s ease-in-out infinite; }
    .mane { animation: mane 3.5s ease-in-out infinite; transform-origin: 250px 250px; }
    .ice { animation: floatIce 8s ease-in-out infinite; }
    .ice.i2 { animation-delay: 2.6s; }
    @keyframes surf { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-34px); } }
    @keyframes mane { 0%,100% { transform: skewX(0); } 50% { transform: skewX(-4deg); } }
    @keyframes floatIce { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-5px) rotate(1.5deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="d6sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset=".6" stop-color="#fbcfe8"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="d6sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#d6sky)"/>
  <circle cx="620" cy="110" r="40" fill="#fff7ed" opacity=".9"/>

  <!-- 遠方冰川 -->
  <path d="M430 220 L 520 160 L 590 200 L 680 150 L 800 214 L 800 240 L 430 240 Z" fill="#e0e7ff"/>
  <path d="M520 162 L 560 186 L 540 200 L 508 178 Z" fill="#c7d2fe"/>

  <!-- 海（冰河湖面） -->
  <rect y="240" width="800" height="110" fill="url(#d6sea)"/>
  <g class="surf" stroke="#c7d2fe" stroke-width="3" fill="none" opacity=".6" stroke-linecap="round">
    <path d="M-40 268 Q 30 262 100 268 T 240 268 T 380 268 T 520 268 T 660 268 T 840 268"/>
  </g>

  <!-- 浮冰 -->
  <g class="ice">
    <path d="M470 292 l 26 -22 l 38 6 l 16 20 l -30 12 l -42 -4 Z" fill="#e0f2fe"/>
    <path d="M482 288 l 14 -12 l 22 4 l 8 10 Z" fill="#bae6fd"/>
  </g>
  <g class="ice i2">
    <path d="M610 300 l 20 -16 l 30 4 l 12 16 l -24 10 l -34 -4 Z" fill="#dbeafe"/>
  </g>
  <g class="ice" style="animation-delay:4.5s">
    <path d="M710 288 l 16 -12 l 24 4 l 8 12 l -18 8 l -26 -3 Z" fill="#e0f2fe" opacity=".9"/>
  </g>

  <!-- 黑沙灘 -->
  <path d="M0 350 Q 220 330 440 352 Q 640 370 800 352 L 800 450 L 0 450 Z" fill="#0f172a"/>
  <path class="surf" d="M-40 348 Q 100 338 240 350 T 520 350 T 840 348 L 840 362 Q 600 374 360 362 Q 140 354 -40 362 Z" fill="#f8fafc" opacity=".85"/>

  <!-- 玄武岩柱 -->
  <g fill="#1e293b">
    <rect x="690" y="250" width="26" height="104" rx="3"/>
    <rect x="718" y="230" width="26" height="124" rx="3"/>
    <rect x="746" y="206" width="26" height="148" rx="3"/>
    <rect x="774" y="230" width="26" height="124" rx="3"/>
  </g>

  <!-- 冰島馬與騎士 -->
  <g>
    <!-- 身體 -->
    <path d="M180 300 q -10 -44 32 -50 q 20 -4 44 -2 q 30 -34 40 -22 q 6 8 2 26 q 16 10 14 34 q -2 26 -26 30 l -6 42 l -14 0 l -2 -38 l -48 0 l -4 38 l -14 0 l -4 -44 q -16 -8 -14 -14" fill="#92400e"/>
    <!-- 鬃毛（冰島馬的厚瀏海） -->
    <g class="mane" fill="#451a03">
      <path d="M282 224 q 22 -12 20 16 q -2 20 -14 30 q -12 -20 -6 -46"/>
      <path d="M262 232 q -34 6 -60 2 q 6 -18 34 -20 q 20 -2 26 18"/>
    </g>
    <!-- 尾巴 -->
    <path d="M182 268 q -26 8 -30 46 q 16 4 26 -12 q 8 -16 4 -34" fill="#451a03"/>
    <!-- 騎士 -->
    <circle cx="236" cy="212" r="12" fill="#fcd9b8"/>
    <path d="M224 224 q 12 -8 24 0 l 4 30 q -16 8 -32 0 Z" fill="#dc2626"/>
    <rect x="224" y="252" width="10" height="26" rx="4" fill="#1e3a8a"/>
    <!-- 馬眼 -->
    <circle cx="290" cy="246" r="3" fill="#0f172a"/>
  </g>
</svg>
