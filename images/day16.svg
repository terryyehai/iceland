<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img">
  <title>Day 16 抵達溫暖的家：台北 101 夜景</title>
  <style>
    .win { animation: twinkle 4s ease-in-out infinite; }
    .plane16 { animation: land 12s ease-in-out infinite; }
    .starT { animation: twinkle 3.2s ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes land {
      0% { transform: translate(-160px,-140px) rotate(6deg); }
      70% { transform: translate(420px,10px) rotate(2deg); }
      100% { transform: translate(900px,60px) rotate(0deg); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="d16sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset=".7" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#d16sky)"/>

  <!-- 月亮與星星 -->
  <circle cx="120" cy="80" r="30" fill="#fef9c3"/>
  <circle cx="108" cy="72" r="26" fill="#0f172a" opacity=".85"/>
  <g fill="#e2e8f0">
    <circle class="starT" cx="240" cy="60" r="2.2"/>
    <circle class="starT" cx="330" cy="110" r="1.8" style="animation-delay:.9s"/>
    <circle class="starT" cx="620" cy="50" r="2.4" style="animation-delay:1.7s"/>
    <circle class="starT" cx="720" cy="130" r="1.8" style="animation-delay:.4s"/>
    <circle class="starT" cx="60" cy="180" r="1.8" style="animation-delay:2.2s"/>
  </g>

  <!-- 降落的飛機 -->
  <g class="plane16">
    <g transform="translate(-40,120) scale(.72)">
      <path d="M -70 0 Q -63 -11 -38 -12 L 60 -12 Q 86 -9 96 0 Q 86 8 60 9 L -38 9 Q -63 9 -70 0 Z" fill="#e2e8f0"/>
      <path d="M -69 -1 L -50 -36 L -32 -36 L -48 -1 Z" fill="#dc2626"/>
      <path d="M 6 1 L -46 38 L -20 40 L 28 5 Z" fill="#cbd5e1"/>
      <circle class="win" cx="100" cy="4" r="4" fill="#f87171"/>
    </g>
  </g>

  <!-- 城市天際線 -->
  <g>
    <!-- 台北101 -->
    <g>
      <rect x="384" y="96" width="32" height="18" fill="#0e7490"/>
      <path d="M378 114 L 422 114 L 414 138 L 386 138 Z" fill="#155e75"/>
      <path d="M376 138 L 424 138 L 415 164 L 385 164 Z" fill="#0e7490"/>
      <path d="M374 164 L 426 164 L 416 190 L 384 190 Z" fill="#155e75"/>
      <path d="M372 190 L 428 190 L 417 216 L 383 216 Z" fill="#0e7490"/>
      <path d="M370 216 L 430 216 L 418 242 L 382 242 Z" fill="#155e75"/>
      <path d="M368 242 L 432 242 L 419 268 L 381 268 Z" fill="#0e7490"/>
      <path d="M366 268 L 434 268 L 420 294 L 380 294 Z" fill="#155e75"/>
      <path d="M364 294 L 436 294 L 424 330 L 376 330 Z" fill="#0e7490"/>
      <rect x="394" y="52" width="12" height="44" fill="#164e63"/>
      <rect x="398" y="30" width="4" height="26" fill="#67e8f9"/>
      <circle class="win" cx="400" cy="28" r="3.6" fill="#f87171"/>
      <!-- 燈點 -->
      <g fill="#a5f3fc">
        <circle class="win" cx="390" cy="150" r="2.4"/>
        <circle class="win" cx="410" cy="176" r="2.4" style="animation-delay:.7s"/>
        <circle class="win" cx="392" cy="228" r="2.4" style="animation-delay:1.4s"/>
        <circle class="win" cx="412" cy="254" r="2.4" style="animation-delay:2.1s"/>
        <circle class="win" cx="396" cy="306" r="2.4" style="animation-delay:2.8s"/>
      </g>
    </g>

    <!-- 其他大樓 -->
    <g fill="#1e293b">
      <rect x="60" y="250" width="70" height="130"/>
      <rect x="150" y="220" width="56" height="160"/>
      <rect x="230" y="270" width="80" height="110"/>
      <rect x="330" y="240" width="40" height="140"/>
      <rect x="450" y="236" width="52" height="144"/>
      <rect x="520" y="264" width="76" height="116"/>
      <rect x="618" y="230" width="58" height="150"/>
      <rect x="694" y="258" width="80" height="122"/>
    </g>
    <!-- 大樓窗燈 -->
    <g fill="#fbbf24">
      <circle class="win" cx="80" cy="272" r="2.6"/><circle class="win" cx="104" cy="292" r="2.6" style="animation-delay:.5s"/><circle class="win" cx="86" cy="322" r="2.6" style="animation-delay:1.1s"/>
      <circle class="win" cx="168" cy="244" r="2.6" style="animation-delay:.3s"/><circle class="win" cx="190" cy="276" r="2.6" style="animation-delay:1.6s"/><circle class="win" cx="172" cy="316" r="2.6" style="animation-delay:2.3s"/>
      <circle class="win" cx="252" cy="290" r="2.6" style="animation-delay:.8s"/><circle class="win" cx="284" cy="312" r="2.6" style="animation-delay:1.9s"/>
      <circle class="win" cx="346" cy="262" r="2.6" style="animation-delay:1.3s"/><circle class="win" cx="352" cy="300" r="2.6" style="animation-delay:.2s"/>
      <circle class="win" cx="468" cy="258" r="2.6" style="animation-delay:.6s"/><circle class="win" cx="486" cy="296" r="2.6" style="animation-delay:1.8s"/>
      <circle class="win" cx="544" cy="286" r="2.6" style="animation-delay:1s"/><circle class="win" cx="572" cy="316" r="2.6" style="animation-delay:2.6s"/>
      <circle class="win" cx="636" cy="252" r="2.6" style="animation-delay:.4s"/><circle class="win" cx="658" cy="288" r="2.6" style="animation-delay:1.5s"/>
      <circle class="win" cx="716" cy="280" r="2.6" style="animation-delay:.9s"/><circle class="win" cx="744" cy="312" r="2.6" style="animation-delay:2s"/>
    </g>
  </g>

  <!-- 地面與河面反光 -->
  <rect y="380" width="800" height="70" fill="#0b1120"/>
  <g opacity=".35" fill="#fbbf24">
    <rect x="78" y="392" width="4" height="18" rx="2"/>
    <rect x="168" y="396" width="4" height="14" rx="2"/>
    <rect x="398" y="390" width="5" height="26" rx="2.5" fill="#67e8f9"/>
    <rect x="544" y="394" width="4" height="16" rx="2"/>
    <rect x="716" y="392" width="4" height="18" rx="2"/>
  </g>

  <!-- 溫暖的家 -->
  <g>
    <rect x="614" y="330" width="86" height="50" fill="#7c2d12"/>
    <path d="M606 332 L 657 296 L 708 332 Z" fill="#9a3412"/>
    <rect x="646" y="350" width="22" height="30" fill="#431407"/>
    <rect x="624" y="342" width="16" height="14" fill="#fde68a"/>
    <rect x="674" y="342" width="16" height="14" fill="#fde68a"/>
    <!-- 煙囪炊煙 -->
    <rect x="684" y="304" width="10" height="18" fill="#7c2d12"/>
    <circle cx="690" cy="296" r="5" fill="#94a3b8" opacity=".6"/>
    <circle cx="696" cy="286" r="4" fill="#94a3b8" opacity=".4"/>
  </g>
</svg>
