<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img">
  <title>Day 12 世紀日全蝕：Hvítserkur 犀牛岩上空的日冕</title>
  <style>
    .corona { animation: pulse 5s ease-in-out infinite; transform-origin: 560px 120px; }
    .corona2 { animation: pulse 5s ease-in-out infinite 2.5s; transform-origin: 560px 120px; }
    .star { animation: twinkle 3s ease-in-out infinite; }
    .glimmer { animation: shimmer 7s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity:.85; } 50% { transform: scale(1.1); opacity:.5; } }
    @keyframes twinkle { 0%,100% { opacity: .9; } 50% { opacity: .2; } }
    @keyframes shimmer { 0%,100% { opacity: .3; } 50% { opacity: .6; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <radialGradient id="d12sky" cx=".7" cy=".25" r="1.1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset=".5" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0c0a2e"/>
    </radialGradient>
    <radialGradient id="d12corona" cx=".5" cy=".5" r=".5">
      <stop offset=".55" stop-color="#fef9c3" stop-opacity="0"/>
      <stop offset=".72" stop-color="#fef9c3" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fef9c3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#d12sky)"/>

  <!-- 星星（白天全蝕時可見） -->
  <g fill="#e0e7ff">
    <circle class="star" cx="90" cy="60" r="2.4"/>
    <circle class="star" cx="220" cy="110" r="2" style="animation-delay:.8s"/>
    <circle class="star" cx="330" cy="50" r="2.6" style="animation-delay:1.6s"/>
    <circle class="star" cx="720" cy="60" r="2" style="animation-delay:.4s"/>
    <circle class="star" cx="770" cy="180" r="2.4" style="animation-delay:2s"/>
    <circle class="star" cx="150" cy="180" r="1.8" style="animation-delay:1.2s"/>
    <circle class="star" cx="420" cy="90" r="2" style="animation-delay:2.4s"/>
  </g>

  <!-- 日全蝕：日冕 + 月影 -->
  <circle class="corona" cx="560" cy="120" r="86" fill="url(#d12corona)"/>
  <circle class="corona2" cx="560" cy="120" r="70" fill="url(#d12corona)"/>
  <g class="corona" stroke="#fef08a" stroke-width="2.6" opacity=".65" stroke-linecap="round">
    <path d="M560 34 L 560 14 M560 206 L 560 226 M474 120 L 454 120 M646 120 L 666 120"/>
    <path d="M500 60 L 486 46 M620 180 L 634 194 M620 60 L 634 46 M500 180 L 486 194"/>
  </g>
  <circle cx="560" cy="120" r="46" fill="#04030f"/>
  <circle cx="560" cy="120" r="46" fill="none" stroke="#fef9c3" stroke-width="3.4"/>

  <!-- 地平線微光 -->
  <path class="glimmer" d="M0 300 L 800 300 L 800 286 Q 400 270 0 286 Z" fill="#f97316"/>

  <!-- 海 -->
  <rect y="300" width="800" height="150" fill="#0b1030"/>
  <ellipse class="glimmer" cx="560" cy="316" rx="150" ry="5" fill="#fef08a"/>
  <ellipse class="glimmer" cx="540" cy="348" rx="90" ry="4" fill="#fbbf24" style="animation-delay:3s"/>

  <!-- Hvítserkur 犀牛岩 -->
  <g fill="#171233">
    <path d="M150 372 L 156 260 Q 158 234 178 226 Q 200 216 216 230 L 230 214 Q 252 200 268 216 Q 282 230 276 254 L 286 372 Z"/>
    <!-- 岩石雙腳空隙 -->
    <path d="M188 372 L 192 312 Q 204 296 218 312 L 222 372 Z" fill="#0b1030"/>
  </g>
  <!-- 岩上白斑（鳥糞的白衣） -->
  <path d="M178 232 Q 198 222 214 234 L 210 250 Q 194 242 182 248 Z" fill="#c7d2fe" opacity=".5"/>

  <!-- 前景黑沙灘與觀測人群 -->
  <path d="M0 396 Q 220 380 460 396 Q 650 408 800 396 L 800 450 L 0 450 Z" fill="#04030f"/>
  <g fill="#1e1b4b">
    <g>
      <circle cx="420" cy="386" r="8"/>
      <rect x="413" y="394" width="14" height="22" rx="6"/>
    </g>
    <g>
      <circle cx="470" cy="390" r="7"/>
      <rect x="464" y="397" width="12" height="20" rx="5"/>
    </g>
    <!-- 三腳架相機 -->
    <path d="M520 380 l -10 32 m 10 -32 l 10 32 m -10 -32 l 0 34" stroke="#1e1b4b" stroke-width="3.4"/>
    <rect x="510" y="368" width="20" height="13" rx="3"/>
  </g>
  <!-- 日蝕眼鏡反光 -->
  <path d="M413 384 l 14 0" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <path d="M464 388 l 12 0" stroke="#fbbf24" stroke-width="2.6" stroke-linecap="round"/>
</svg>
